[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "source"}

[project]
name = "idea"
dynamic = ["version"]
description = "Research and Engineering Studio"
readme = "README.md"
requires-python = ">=3.12.0"
license = {text = "Apache Software License"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AWS CDK :: 2",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Typing :: Typed",
]

[tool.setuptools.dynamic]
version = {file = ["RES_VERSION.txt"]}

[project.scripts]
cdk-app = "idea.app:main"

[tool.black]
include = 'source/.*\.py'
# TODO: Change the path to include all the source files
extend-exclude = 'source/idea/idea-*|dcv_swagger_client|dcv_session_management_client|res_meta|backend|dcv_session_management|source/res/api|data-model'

[tool.isort]
profile = "black"
known_first_party = "idea,ideadatamodel"
# TODO: Change the path to include all the source files
skip_glob = ["source/idea/idea-*", "*dcv_swagger_client*", "*dcv_session_management_client*", "*res_meta*", "*backend*", "*dcv_session_management*", "source/res/api", "*data-model*"]

[tool.mypy]
exclude = [
    "idea-*",
    "lambda_*",
    "backend.*",
    "dcv_session_management.*",
    "source/res/api/",
    "bootstrap_userdata_builder"
]

[tool.pytest.ini_options]
# Integration test suite/capability markers. Suites (dev/nightly/release) are
# selected by the invoke integ-tests.<suite> tasks via `-m`; capability markers
# layer on top as filters. See tasks/integ_tests.py SUITE_MARKER_EXPR.
markers = [
    # --- suite markers ---
    "dev: fast per-commit checks (API + dry-run), minutes",
    "nightly: scheduled full smoke + VDI lifecycle across the OS matrix (~1-2h)",
    "release: comprehensive pre-release (scale, snapshot, multi-env install, all OS)",
    # --- capability markers (orthogonal; gate by environment/resources) ---
    "requires_vdi: launches a real VDI (provisioning, slow)",
    "linux_only: only valid on Linux software stacks",
    "windows: requires a Windows VDI",
    "gpu: requires a GPU instance / driver validation",
    "ui: Selenium/browser-driven (Chrome/Firefox) UI flow",
    "scale: large-scale (e.g. ~500 VDIs) batch/concurrency test",
    "govcloud: GovCloud-partition-specific or GovCloud-gated",
    "in_vdi: runs in-VDI checks over SSM (ssm_utils)",
    "infra_validation: boto3 describe-only post-install infra assertions",
    "smoke_subset: minimal single-OS (AL2023) smoke subset for the per-commit pipeline",
    "smart_retry: smart retry VDI launch test (mutates global state, must run in isolation)",
]
# Default collection root for bare `pytest -m <suite>` suite runs. Explicit path
# arguments (used by all unit-test and existing integ-test invocations) override
# this, so it only affects marker-driven suite runs.
testpaths = ["source/tests/integration/tests"]
