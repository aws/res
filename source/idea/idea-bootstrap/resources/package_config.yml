package_config:
  amazon_cloudwatch_agent:
    download_link: ~
    # since there are multiple variations and platforms, to avoid creating multiple configuration entries, below pattern is used.
    # you can always override the downloading link by providing the download_link.
    # if download_link is empty, download_link_pattern will be used to download cloudwatch agent
    # refer to below files to perform additional customizations or implementation details:
    #  * idea-bootstrap/_templates/linux/cloudwatch_agent.jinja2
    #  * idea-bootstrap/_templates/windows/cloudwatch_agent.jinja2
    # CN and GovCloud Partitions will need to change or adjust the download_url_pattern accordingly.
    download_link_pattern: https://s3.%region%.amazonaws.com/amazoncloudwatch-agent-%region%/%os%/%architecture%/latest/amazon-cloudwatch-agent.%ext%

  aws_ssm:
    x86_64: https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/linux_amd64/amazon-ssm-agent.rpm
    aarch64: https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/linux_arm64/amazon-ssm-agent.rpm

  system:
    red_hat:
      # Default packages installed on all Linux systems, kernel related packages' version is pinned to the running kernel's
      # version to keep them synchronized.
      - dnf-plugins-core
      - git
      - kernel-core-$(uname -r)
      - kernel-devel-$(uname -r)
      - kernel-headers-$(uname -r)
      - kernel-modules-$(uname -r)
      - kernel-modules-core-$(uname -r)
      - kernel-tools-$(uname -r)
      - kernel-tools-libs-$(uname -r)
      - libselinux
      - libselinux-devel
      - libselinux-utils
      - nscd
      - rpm-build
      - tar
      - vim
      - wget
      - cronie
      - python3
      - python3-pip
      - python3-devel
    debian:
      - policycoreutils
      - expect
      - nscd
      - libsasl2-dev
      - python3
      - python3-venv
      - python3-pip
      - python3-dev

  sssd:
    # SSSD and dependencies
    red_hat:
      - adcli
      - authconfig
      - krb5-workstation
      - oddjob
      - oddjob-mkhomedir
      - openldap-clients
      - openldap-devel
      - realmd
      - samba-common-tools
      - sssd
      - sssd-tools
    debian:
      - sssd-ad
      - sssd-ldap
      - ldap-utils
      - libldap2-dev
      - realmd
      - krb5-user
      - sssd-krb5
      - sssd-tools
      - adcli

  putty:
    # used by cluster-manager to convert .pem files to .ppk files
    red_hat:
      - putty


  host_modules:
    nss:
      - libnss_cognito
    pam:
      - pam_cognito
      - ssh_keygen

  fsx_lustre_client:
    prerequisites:
      red_hat:
        public_key: https://fsx-lustre-client-repo-public-keys.s3.amazonaws.com/fsx-rpm-public-key.asc
        repo:
          rhel8: https://fsx-lustre-client-repo.s3.amazonaws.com/el/8/fsx-lustre-client.repo
          rhel9: https://fsx-lustre-client-repo.s3.amazonaws.com/el/9/fsx-lustre-client.repo
      debian:
        public_key: https://fsx-lustre-client-repo-public-keys.s3.amazonaws.com/fsx-ubuntu-public-key.asc
        repo: https://fsx-lustre-client-repo.s3.amazonaws.com/ubuntu
    red_hat:
      al2:
        - lustre
      al2023:
        - lustre-client
      rhel:
        - kmod-lustre-client
        - lustre-client
    debian:
      ubuntu:
        - lustre-client-modules-$(uname -r)

  efs_mount_helper:
    build_dependencies:
      red_hat:
        rhel:
          - rust-toolset
          - rust
          - cargo
          - make
          - openssl-devel
      debian:
        ubuntu:
          - binutils
          - rustc
          - cargo
          - pkg-config
          - libssl-dev
    al2: amazon-efs-utils
    repo: https://github.com/aws/efs-utils

  python:
    build_dependencies:
      red_hat:
        al2:
          - gcc
          - make
          - patch
          - zlib-devel
          - bzip2
          - bzip2-devel
          - readline-devel
          - sqlite
          - sqlite-devel
          - openssl11-devel
          - tk-devel
          - libffi-devel
          - xz-devel
