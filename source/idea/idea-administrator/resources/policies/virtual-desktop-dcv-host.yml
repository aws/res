Version: '2012-10-17'
Statement:

  - Action:
      - logs:CreateLogGroup
      - logs:CreateLogStream
      - logs:PutLogEvents
      - logs:PutRetentionPolicy
    Resource: '*'
    Effect: Allow

  - Action:
      - s3:GetObject
      - s3:ListBucket
    Resource:
      {{ context.utils.to_yaml(context.arns.s3_global_arns) | indent(6) }}
    Effect: Allow

  - Action:
      - s3:GetObject
      - s3:ListBucket
    Resource:
      {{ context.utils.to_yaml(context.arns.s3_bucket_arns) | indent(6) }}
    Effect: Allow

  - Action:
      - s3:GetObject
      - s3:ListBucket
    Resource:
      {{ context.utils.to_yaml(context.arns.dcv_license_s3_bucket_arns) | indent(6) }}
    Effect: Allow

  - Effect: Allow
    Action: 
      - sqs:SendMessage
    Resource:
      - '{{ context.arns.get_sqs_arn(context.config.get_module_id("virtual-desktop-controller") + "-events.fifo") }}'

  - Action:
      - ec2:CreateTags
    Resource:
      - '{{ context.arns.get_arn("ec2", "volume/*", aws_region="*") }}'
      - '{{ context.arns.get_arn("ec2", "network-interface/*", aws_region="*") }}'
      - '{{ context.arns.get_arn("ec2", "instance/*", aws_region="*") }}'
    Effect: Allow

  - Action:
      - ec2:DescribeVolumes
      - ec2:DescribeNetworkInterfaces
      - fsx:DescribeFileSystems
      - tag:GetResources
      - tag:GetTagValues
      - tag:GetTagKeys
    Resource: '*'
    Effect: Allow

  - Action:
      - kinesis:ListShards
      - kinesis:GetRecords
      - kinesis:GetShardIterator
    Resource:
      - '{{ context.arns.get_ddb_table_stream_arn("cluster-settings") }}'
    Effect: Allow

  - Action:
      - dynamodb:GetItem
      - dynamodb:Scan
      - dynamodb:DescribeTable
    Resource:
      - '{{ context.arns.get_ddb_table_arn("cluster-settings") }}'
      - '{{ context.arns.get_ddb_table_arn("cluster-settings/stream/*") }}'
      - '{{ context.arns.get_ddb_table_arn("modules") }}'
      - '{{ context.arns.get_ddb_table_arn("accounts.users") }}'
    Effect: Allow

  - Action:
      - execute-api:Invoke
    Resource:
      - '{{ context.arns.custom_credential_broker_api_gateway_execute_get_api_arn() }}'
      - '{{ context.arns.vdi_helper_api_gateway_execute_api_arn() }}'
    Effect: Allow

  - Action:
      - s3:GetObject
    Resource:
      {{ context.utils.to_yaml(context.arns.s3_public_host_modules) | indent(6) }}
    Effect: Allow

  - Action:
      - cognito-idp:AdminInitiateAuth
      - cognito-idp:AdminGetUser
      - cognito-idp:ListGroups
      - cognito-idp:AdminListGroupsForUser
      - cognito-idp:ListUsers
    Resource: '{{ context.arns.user_pool_arn }}'
    Effect: Allow

{% include '_templates/activedirectory.yml' %}

{% include '_templates/custom-kms-key.yml' %}
