<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research and Engineering Studio: deployed architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1400px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · doc-wide · balanced · mixed</p>
    <h1>Research and Engineering Studio: deployed architecture</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="res-arch-light-title res-arch-light-desc">
      <title id="res-arch-light-title">Research and Engineering Studio: deployed architecture</title>
      <desc id="res-arch-light-desc">Portal and desktop users reach an Application Load Balancer, which routes portal requests to a backend API on AWS Lambda and portal sign-in to a Cognito user pool. The backend API launches virtual desktops on Amazon EC2 with Amazon DCV, which are reached through the infrastructure hosts and read software packages from an S3 staging bucket, home directories from EFS, and POSIX identity from AWS Managed Microsoft AD. The backend API reads and writes DynamoDB, and the AD sync job and event handlers read the same directory.</desc>
      <defs>
        <marker id="res-arch-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="res-arch-light-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="264" y="104" width="560" height="328" rx="8" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="280" y="128" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PLATFORM · ONE VPC</text>

      <rect x="872" y="104" width="368" height="328" rx="8" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="888" y="128" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STATE</text>

      <rect x="264" y="472" width="976" height="120" rx="8" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="280" y="496" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">IDENTITY</text>

      <!-- Connectors -->
      <!-- Users -> Load balancer -->
      <path d="M216,180 H288" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#res-arch-light-arrow-link)"/>
      <!-- Load balancer -> Backend API -->
      <path d="M528,180 H560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#res-arch-light-arrow)"/>
      <!-- Backend API -> DynamoDB -->
      <path d="M800,180 H896" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#res-arch-light-arrow)"/>
      <!-- Backend API -> Virtual desktops -->
      <path d="M680,208 V248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#res-arch-light-arrow)"/>
      <!-- Infrastructure hosts -> Virtual desktops -->
      <path d="M528,280 H560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#res-arch-light-arrow)"/>
      <!-- Virtual desktops -> S3 staging bucket -->
      <path d="M800,276 H896" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#res-arch-light-arrow)"/>
      <!-- Virtual desktops -> EFS home directories -->
      <path d="M800,308 H816 A8,8 0 0 1 824,316 V372 A8,8 0 0 0 832,380 H896" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#res-arch-light-arrow)"/>
      <!-- Load balancer -> Cognito user pool -->
      <path d="M288,196 H248 A8,8 0 0 0 240,204 V532 A8,8 0 0 0 248,540 H288" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#res-arch-light-arrow)"/>
      <!-- AD sync and event handlers -> Managed Microsoft AD -->
      <path d="M408,408 V456 A8,8 0 0 0 416,464 H988 A8,8 0 0 1 996,472 V512" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#res-arch-light-arrow)"/>
      <!-- Virtual desktops -> Managed Microsoft AD -->
      <path d="M680,320 V440 A8,8 0 0 0 688,448 H1096 A8,8 0 0 1 1104,456 V512" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#res-arch-light-arrow)"/>

      <!-- Arrow labels -->
      <rect x="228" y="160" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <rect x="804" y="160" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="846" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READS STATE</text>

      <rect x="688" y="220" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LAUNCHES</text>

      <rect x="820" y="256" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="848" y="265" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PACKAGES</text>

      <rect x="832" y="360" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="862" y="369" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOME DIRS</text>

      <rect x="168" y="440" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="449" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGN-IN</text>

      <rect x="416" y="416" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="464" y="425" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DIRECTORY SYNC</text>

      <rect x="688" y="384" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="736" y="393" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POSIX IDENTITY</text>

      <!-- Client -->
      <rect x="40" y="152" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="152" width="176" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="128" y="185" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Portal and desktop users</text>

      <!-- Platform -->
      <rect x="288" y="152" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="152" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="408" y="185" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application Load Balancer</text>

      <rect x="560" y="152" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="152" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="680" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend API</text>
      <text x="680" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AWS Lambda</text>

      <rect x="288" y="248" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="248" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="408" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Infrastructure hosts</text>
      <text x="408" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vdc-gateway, cluster-manager, bastion</text>

      <rect x="560" y="248" width="240" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="248" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="680" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Virtual desktops</text>
      <text x="680" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Amazon EC2 with Amazon DCV</text>

      <rect x="288" y="352" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="352" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="408" y="385" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AD sync and event handlers</text>

      <!-- State -->
      <rect x="896" y="152" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="896" y="152" width="320" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="1056" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DynamoDB</text>
      <text x="1056" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">23 tables</text>

      <rect x="896" y="248" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="896" y="248" width="320" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="1056" y="281" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">S3 staging bucket</text>

      <rect x="896" y="352" width="320" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="896" y="352" width="320" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="1056" y="385" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EFS home directories</text>

      <!-- Identity -->
      <rect x="288" y="512" width="440" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="512" width="440" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
      <text x="508" y="545" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cognito user pool</text>

      <rect x="776" y="512" width="440" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="512" width="440" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
      <text x="996" y="545" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AWS Managed Microsoft AD</text>

      <!-- Legend -->
      <line x1="40" y1="624" x2="1240" y2="624" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="636" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="144" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL</text>

      <rect x="232" y="636" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="256" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SERVICE</text>

      <rect x="360" y="636" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="384" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STORE</text>

      <rect x="472" y="636" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
      <text x="496" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DIRECTORY</text>

      <rect x="616" y="636" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="640" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">USERS</text>

      <line x1="728" y1="641" x2="760" y2="641" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="768" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTPS</text>

      <line x1="864" y1="641" x2="896" y2="641" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="904" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">IDENTITY LOOKUP</text>
    </svg>
  </div>
</body>
</html>
